<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarPub - Menù Digitale</title>
<style>
:root{--primary:#3b2314;--accent:#d97706;--bg:#f8f5f2;--card:#fff;--text:#292524;--muted:#78716c;--border:#e7e5e4;--success:#16a34a;--danger:#dc2626}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{background:var(--bg);color:var(--text);padding-bottom:110px}header{background:var(--primary);color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.logo{font-size:1.25rem;font-weight:bold}.nav-controls{display:flex;gap:8px}.btn-nav,.btn-lang{background:rgba(255,255,255,.15);color:#fff;border:1px solid transparent;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer}.btn-lang{background:transparent;border-color:rgba(255,255,255,.4)}.btn-nav.active{background:#fff;color:var(--primary)}.container{max-width:800px;margin:auto;padding:20px}.hero{text-align:center;margin-bottom:20px}.hero h1{font-size:1.6rem;color:var(--primary)}.hero p{font-size:.9rem;color:var(--muted);margin-top:6px}.table-selector-card,.pin-box{background:var(--card);padding:16px;border-radius:14px;margin-bottom:20px;border:1px solid var(--border)}.table-selector-card label{display:block;font-weight:bold;margin-bottom:10px;color:var(--primary)}.table-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.table-btn{padding:12px 0;border:1px solid var(--border);background:var(--bg);border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer}.table-btn.selected{background:var(--primary);color:#fff}.categories{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:15px}.cat-btn{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:20px;white-space:nowrap;font-weight:600;color:var(--muted);cursor:pointer}.cat-btn.active{background:var(--primary);color:#fff}.menu-list{display:flex;flex-direction:column;gap:12px}.menu-item{background:var(--card);padding:16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}.item-info h3{font-size:1.05rem;margin-bottom:4px}.item-info p{font-size:.85rem;color:var(--muted);margin-bottom:8px}.item-price{font-weight:bold;color:var(--primary)}.btn-add{background:var(--primary);color:#fff;border:none;width:36px;height:36px;border-radius:10px;font-size:1.3rem;cursor:pointer}.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);padding:14px 20px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:90;border-top:1px solid var(--border)}.cart-summary{display:flex;flex-direction:column;text-align:right}.cart-total{font-size:1.15rem;font-weight:bold;color:var(--primary)}.cart-count{font-size:.8rem;color:var(--muted)}.btn-view-cart{background:var(--accent);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:bold;cursor:pointer}.btn-view-cart:disabled{background:#d6d3d1;cursor:not-allowed}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:flex-end;z-index:200}.modal-overlay.open{display:flex}.modal-content{background:var(--card);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:24px 24px 70px;max-height:85vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px}.btn-close{background:none;border:none;font-size:1.5rem;color:var(--muted);cursor:pointer}.cart-item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.qty-controls{display:flex;align-items:center;gap:10px}.qty-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-weight:bold;cursor:pointer}.btn-submit-order{width:100%;background:var(--success);color:#fff;border:none;padding:15px;border-radius:12px;font-size:1.05rem;font-weight:bold;margin-top:20px;cursor:pointer}.hidden{display:none!important}.pin-box{max-width:340px;margin:40px auto;text-align:center}.pin-input{width:100%;padding:12px;font-size:1.4rem;text-align:center;letter-spacing:6px;border:1px solid var(--border);border-radius:10px;margin:15px 0}.staff-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap}.order-card{background:var(--card);border-left:5px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}.order-card.completed{border-left-color:var(--success);opacity:.7}.order-top,.order-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.table-badge{background:var(--primary);color:#fff;padding:4px 10px;border-radius:6px;font-weight:bold}.order-time{font-size:.85rem;color:var(--muted)}.order-items-list{list-style:none;margin-bottom:12px}.order-items-list li{padding:4px 0;display:flex;justify-content:space-between}.btn-done{background:var(--success);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}.btn-clear{background:var(--danger);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:12px 20px;border-radius:30px;z-index:300;opacity:0;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="logo">☕ BarPub</div><div class="nav-controls"><button class="btn-lang" onclick="toggleLang()">IT / EN</button><button class="btn-nav active" onclick="switchView('customer')" id="navCustomer">Menù</button><button class="btn-nav" onclick="switchView('staff')" id="navStaff">🔒 Banco <span id="badgeCount" style="background:#dc2626;padding:1px 6px;border-radius:10px;display:none"></span></button></div></header>
<div id="toast" class="toast">Messaggio</div>
<main id="customerView" class="container"><div class="hero"><h1 data-i18n="heroTitle">Menù & Ordini al Tavolo</h1><p data-i18n="heroSub">Seleziona il tuo tavolo, scegli dal menù e invia l'ordine direttamente al banco</p></div><div class="table-selector-card"><label data-i18n="selectTable">📍 Seleziona il tuo tavolo (1 - 7):</label><div class="table-grid" id="tableGrid"></div></div><div class="categories" id="categoryTabs"></div><div class="menu-list" id="menuList"></div></main>
<div class="cart-bar" id="cartBar"><button class="btn-view-cart" id="btnViewCart" onclick="openCartModal()" disabled data-i18n="viewOrder">👈 Vedi Ordine</button><div class="cart-summary"><span class="cart-total" id="cartTotal">0,00 €</span><span class="cart-count" id="cartCount" data-i18n="emptyCart">Nessun articolo selezionato</span></div></div>
<div class="modal-overlay" id="cartModal"><div class="modal-content"><div class="modal-header"><h2 data-i18n="yourOrder">Il tuo Ordine</h2><button class="btn-close" onclick="closeCartModal()">&times;</button></div><p id="modalTableInfo" style="font-weight:bold;color:var(--accent);margin-bottom:12px"></p><div id="cartItemsContainer"></div><div style="display:flex;justify-content:space-between;font-size:1.2rem;font-weight:bold;margin-top:16px"><span>Totale:</span><span id="modalTotal">0,00 €</span></div><button class="btn-submit-order" onclick="submitOrder()" data-i18n="sendToCounter">🚀 Invia Ordine al Banco</button></div></div>
<section id="staffView" class="container hidden"><div id="pinSection" class="pin-box"><h2>🔒 Area Riservata Banco</h2><p style="font-size:.85rem;color:var(--muted);margin-top:6px">Inserisci il PIN (default: <strong>1234</strong>)</p><input type="password" id="pinInput" class="pin-input" maxlength="4" inputmode="numeric"><button class="btn-submit-order" onclick="verifyPin()">Accedi</button></div><div id="dashboardSection" class="hidden"><div class="staff-header"><div><h2>📋 Comande Tavoli (1-7)</h2></div><div><button class="btn-clear" onclick="clearAllOrders()">🗑️ Pulisci Tutto</button> <button class="btn-nav" style="background:var(--primary)" onclick="logoutStaff()">Esci</button></div></div><div id="ordersList"></div></div></section>
<script>
const STAFF_PIN="1234";let currentLang="it",selectedTable=null,selectedCategory="all",cart=[],isStaffAuthenticated=false,knownOrderIds=new Set();
const translations={it:{heroTitle:"Menù & Ordini al Tavolo",heroSub:"Seleziona il tuo tavolo, scegli dal menù e invia l'ordine direttamente al banco",selectTable:"📍 Seleziona il tuo tavolo (1 - 7):",emptyCart:"Nessun articolo selezionato",viewOrder:"👈 Vedi Ordine",yourOrder:"Il tuo Ordine",sendToCounter:"🚀 Invia Ordine al Banco",all:"Tutto",items:"articoli",item:"articolo",selectTableAlert:"⚠️ Seleziona prima il numero del tuo tavolo!",orderSent:"✅ Ordine inviato al banco! Arriviamo subito."},en:{heroTitle:"Menu & Table Ordering",heroSub:"Select your table, choose from the menu and send your order directly to the bar",selectTable:"📍 Select your table (1 - 7):",emptyCart:"No items selected",viewOrder:"👈 View Order",yourOrder:"Your Order",sendToCounter:"🚀 Send Order to Bar",all:"All",items:"items",item:"item",selectTableAlert:"⚠️ Please select your table number first!",orderSent:"✅ Order sent to the bar! Coming right up."}};
const menuData=[
{id:1,cat:"Caffetteria",name_it:"Caffè Espresso",name_en:"Espresso Coffee",desc_it:"Miscela 100% Arabica",desc_en:"100% Arabica blend",price:1.20},{id:2,cat:"Caffetteria",name_it:"Cappuccino",name_en:"Cappuccino",desc_it:"Espresso con crema di latte",desc_en:"Espresso with steamed milk foam",price:1.60},{id:3,cat:"Caffetteria",name_it:"Caffè Macchiato",name_en:"Espresso Macchiato",desc_it:"Espresso con un goccio di latte",desc_en:"Espresso with a dash of milk",price:1.30},{id:4,cat:"Caffetteria",name_it:"Caffè Ginseng",name_en:"Ginseng Coffee",desc_it:"Cremoso ed energizzante",desc_en:"Creamy and energizing",price:1.80},{id:5,cat:"Brioches & Dolci",name_it:"Cornetto Vuoto / Crema",name_en:"Plain / Custard Croissant",desc_it:"Sfoglia artigianale calda",desc_en:"Warm artisan puff pastry",price:1.50},{id:6,cat:"Brioches & Dolci",name_it:"Cornetto Pistacchio",name_en:"Pistachio Croissant",desc_it:"Farcito con crema di pistacchio",desc_en:"Filled with pistachio cream",price:1.80},{id:7,cat:"Brioches & Dolci",name_it:"Torta della Nonna",name_en:"Grandma's Cake",desc_it:"Frolla, crema pasticcera e pinoli",desc_en:"Shortcrust, custard and pine nuts",price:3.50},{id:8,cat:"Bevande",name_it:"Acqua Naturale / Frizzante",name_en:"Still / Sparkling Water",desc_it:"Bottiglia 50cl",desc_en:"50cl bottle",price:1.20},{id:9,cat:"Bevande",name_it:"Spremuta d'Arancia",name_en:"Fresh Orange Juice",desc_it:"Arance fresche spremute al momento",desc_en:"Freshly squeezed oranges",price:3.50},{id:10,cat:"Bevande",name_it:"Coca-Cola / Fanta",name_en:"Coca-Cola / Fanta",desc_it:"Lattina 33cl con ghiaccio e limone",desc_en:"33cl can with ice and lemon",price:2.80},{id:11,cat:"Aperitivi & Snack",name_it:"Spritz Aperol / Campari",name_en:"Aperol / Campari Spritz",desc_it:"Servito con patatine e olive",desc_en:"Served with chips and olives",price:5.50},{id:12,cat:"Aperitivi & Snack",name_it:"Toast Classico",name_en:"Classic Ham & Cheese Toast",desc_it:"Prosciutto cotto e fontina",desc_en:"Cooked ham and fontina cheese",price:4.00},{id:13,cat:"Aperitivi & Snack",name_it:"Tramezzino Tonno e Uova",name_en:"Tuna & Egg Sandwich",desc_it:"Pane morbido artigianale",desc_en:"Soft artisan bread",price:3.20}
];
function init(){renderTables();renderCategories();renderMenu();loadOrdersForBadge();setInterval(checkRealtimeOrders,2500)}
function formatPrice(n){return n.toFixed(2).replace('.',',')+' €'}function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function toggleLang(){currentLang=currentLang==='it'?'en':'it';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(translations[currentLang][k])el.textContent=translations[currentLang][k]});renderCategories();renderMenu();updateCartUI()}
function renderTables(){const g=document.getElementById('tableGrid');g.innerHTML='';for(let i=1;i<=7;i++){const b=document.createElement('button');b.className=`table-btn ${selectedTable===i?'selected':''}`;b.textContent=i;b.onclick=()=>{selectedTable=i;renderTables();updateCartUI()};g.appendChild(b)}}
function renderCategories(){const t=document.getElementById('categoryTabs'),cats=['all',...new Set(menuData.map(m=>m.cat))];t.innerHTML=cats.map(c=>`<button class="cat-btn ${selectedCategory===c?'active':''}" onclick="selectCategory('${c}')">${c==='all'?translations[currentLang].all:c}</button>`).join('')}
function selectCategory(c){selectedCategory=c;renderCategories();renderMenu()}function renderMenu(){const l=document.getElementById('menuList'),f=selectedCategory==='all'?menuData:menuData.filter(m=>m.cat===selectedCategory);l.innerHTML=f.map(i=>`<div class="menu-item"><div class="item-info"><h3>${currentLang==='it'?i.name_it:i.name_en}</h3><p>${currentLang==='it'?i.desc_it:i.desc_en}</p><div class="item-price">${formatPrice(i.price)}</div></div><button class="btn-add" onclick="addToCart(${i.id})">+</button></div>`).join('')}
function addToCart(id){if(!selectedTable){showToast(translations[currentLang].selectTableAlert);document.querySelector('.table-selector-card').scrollIntoView({behavior:'smooth'});return}const e=cart.find(c=>c.id===id);if(e)e.qty++;else{const p=menuData.find(m=>m.id===id);cart.push({...p,qty:1})}updateCartUI();const p=menuData.find(m=>m.id===id);showToast(`+1 ${currentLang==='it'?p.name_it:p.name_en}`)}
function updateCartUI(){const total=cart.reduce((s,i)=>s+i.price*i.qty,0),count=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cartTotal').textContent=formatPrice(total);const el=document.getElementById('cartCount'),btn=document.getElementById('btnViewCart');if(!count){el.textContent=translations[currentLang].emptyCart;btn.disabled=true}else{const word=count===1?translations[currentLang].item:translations[currentLang].items;el.textContent=`${count} ${word}${selectedTable?' • Tavolo '+selectedTable:''}`;btn.disabled=false}}
function openCartModal(){if(!selectedTable){showToast(translations[currentLang].selectTableAlert);return}document.getElementById('modalTableInfo').textContent=`📍 Tavolo N° ${selectedTable}`;renderCartModalItems();document.getElementById('cartModal').classList.add('open')}function closeCartModal(){document.getElementById('cartModal').classList.remove('open')}
function renderCartModalItems(){const c=document.getElementById('cartItemsContainer');if(!cart.length){closeCartModal();return}c.innerHTML=cart.map(i=>`<div class="cart-item-row"><div><div style="font-weight:bold">${currentLang==='it'?i.name_it:i.name_en}</div><div style="font-size:.85rem;color:var(--muted)">${formatPrice(i.price)} cad.</div></div><div class="qty-controls"><button class="qty-btn" onclick="changeQty(${i.id},-1)">-</button><span style="font-weight:bold">${i.qty}</span><button class="qty-btn" onclick="changeQty(${i.id},1)">+</button></div></div>`).join('');document.getElementById('modalTotal').textContent=formatPrice(cart.reduce((s,i)=>s+i.price*i.qty,0))}
function changeQty(id,d){const i=cart.findIndex(c=>c.id===id);if(i>-1){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1)}updateCartUI();renderCartModalItems()}
function submitOrder(){if(!selectedTable||!cart.length)return;const orders=JSON.parse(localStorage.getItem('bar_orders')||'[]'),newOrder={id:Date.now(),table:selectedTable,time:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),items:cart.map(c=>({name:c.name_it,qty:c.qty,price:c.price})),total:cart.reduce((s,i)=>s+i.price*i.qty,0),status:'pending'};orders.unshift(newOrder);localStorage.setItem('bar_orders',JSON.stringify(orders));cart=[];updateCartUI();closeCartModal();showToast(translations[currentLang].orderSent);loadOrdersForBadge()}
function switchView(v){const c=document.getElementById('customerView'),s=document.getElementById('staffView'),b=document.getElementById('cartBar'),nc=document.getElementById('navCustomer'),ns=document.getElementById('navStaff');if(v==='customer'){c.classList.remove('hidden');b.classList.remove('hidden');s.classList.add('hidden');nc.classList.add('active');ns.classList.remove('active')}else{c.classList.add('hidden');b.classList.add('hidden');s.classList.remove('hidden');nc.classList.remove('active');ns.classList.add('active');if(isStaffAuthenticated)renderStaffOrders()}}
function verifyPin(){const i=document.getElementById('pinInput').value;if(i===STAFF_PIN){isStaffAuthenticated=true;document.getElementById('pinSection').classList.add('hidden');document.getElementById('dashboardSection').classList.remove('hidden');renderStaffOrders()}else{showToast('❌ PIN errato!');document.getElementById('pinInput').value=''}}function logoutStaff(){isStaffAuthenticated=false;document.getElementById('pinInput').value='';document.getElementById('pinSection').classList.remove('hidden');document.getElementById('dashboardSection').classList.add('hidden');switchView('customer')}
function playBeep(){try{const c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);g.gain.setValueAtTime(.2,c.currentTime);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}}
function checkRealtimeOrders(){const orders=JSON.parse(localStorage.getItem('bar_orders')||'[]'),pending=orders.filter(o=>o.status==='pending');let hasNew=false;pending.forEach(o=>{if(!knownOrderIds.has(o.id)){knownOrderIds.add(o.id);hasNew=true}});loadOrdersForBadge();if(hasNew&&isStaffAuthenticated){playBeep();renderStaffOrders()}}
function loadOrdersForBadge(){const n=(JSON.parse(localStorage.getItem('bar_orders')||'[]')).filter(o=>o.status==='pending').length,b=document.getElementById('badgeCount');b.textContent=n;b.style.display=n?'inline-block':'none'}
function renderStaffOrders(){const l=document.getElementById('ordersList'),orders=JSON.parse(localStorage.getItem('bar_orders')||'[]');orders.forEach(o=>knownOrderIds.add(o.id));if(!orders.length){l.innerHTML='<p style="text-align:center;color:var(--muted);margin-top:30px">Nessuna comanda presente al momento.</p>';return}l.innerHTML=orders.map(o=>`<div class="order-card ${o.status==='completed'?'completed':''}"><div class="order-top"><span class="table-badge">Tavolo ${o.table}</span><span class="order-time">🕒 ${o.time} • ${o.status==='pending'?'<span>🟠 In attesa</span>':'<span>✅ Servito</span>'}</span></div><ul class="order-items-list">${o.items.map(i=>`<li><span><strong>${i.qty}x</strong> ${i.name}</span><span>${formatPrice(i.price*i.qty)}</span></li>`).join('')}</ul><div class="order-actions"><strong style="color:var(--primary)">Totale: ${formatPrice(o.total)}</strong>${o.status==='pending'?`<button class="btn-done" onclick="markOrderDone(${o.id})">✓ Segna come Servito</button>`:''}</div></div>`).join('')}
function markOrderDone(id){const orders=JSON.parse(localStorage.getItem('bar_orders')||'[]'),o=orders.find(x=>x.id===id);if(o)o.status='completed';localStorage.setItem('bar_orders',JSON.stringify(orders));renderStaffOrders();loadOrdersForBadge()}function clearAllOrders(){if(confirm('Vuoi cancellare tutte le comande dallo storico?')){localStorage.removeItem('bar_orders');knownOrderIds.clear();renderStaffOrders();loadOrdersForBadge()}}window.addEventListener('storage',e=>{if(e.key==='bar_orders')checkRealtimeOrders()});init();
</script>
</body>
</html>
